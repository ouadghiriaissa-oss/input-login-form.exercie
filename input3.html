<style>
  body{
    display: flex;
justify-content: center;
align-items: center;
background-color: gray;

}
  
.input {
  background-color: #212121;
  max-width: 190px;
  height: 40px;
  padding: 10px;
  border: none;
  border-radius: 5px;
   
}

.input:focus {
  color: rgb(247, 244, 244);
  background-color: #212121;
  outline-color: rgb(235, 47, 235);
  box-shadow: -3px -3px 15px rgb(69, 4, 155);
  transition: .1s;
  transition-property: box-shadow;
  transform: scale(1.1,1);
  transition: 0.5s;
}









</style>
<input placeholder="Enter your text..." class="input" name="text" type="text">
