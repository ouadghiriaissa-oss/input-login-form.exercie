<style>
body{
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: rgb(192, 191, 191);
   
}
    
.group {
  display: flex;
  line-height: 28px;
  align-items: center;
  position: relative;
  max-width: 190px;
}
.input {
  font-family: "Montserrat", sans-serif;
  width: 100%;
  height: 45px;
  padding-left: 2.5rem;
  box-shadow: 0 0 0 1.5px #2b2c37, 0 0 25px -17px #000;
  border: 0;
  border-radius: 12px;
  background-color: #16171d;
  outline: none;
  color: #bdbecb;
  transition: all 0.25s cubic-bezier(0.19, 1, 0.22, 1);
  cursor: text;
  z-index: 0;
}

.input::placeholder {
  color: #bdbecb;
}

.input:hover {
    border: none;
    box-shadow: 1px 5px 15px rgb(59, 59, 59);
}
 
.input:focus {
  transform: scale(1.2,1);
  transition: 1s;
}




</style>
<div class="group">
 

  <input
    id="query"
    class="input"
    type="search"
    placeholder="Search..."
    name="searchbar"
  />
</div>
